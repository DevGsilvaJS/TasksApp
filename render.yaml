services:
  - type: web
    name: tasksapp-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: CorsOrigins
        sync: false
    healthCheckPath: /api/health/version
    autoDeploy: true

